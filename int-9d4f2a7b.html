<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統合在庫ダッシュボード Airbnb × Booking</title>
<link rel="apple-touch-icon" sizes="512x512" href="https://phnhotelsjp-cell.github.io/rm-x7k2/icon-512.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://phnhotelsjp-cell.github.io/rm-x7k2/icon-512.png">
<meta name="apple-mobile-web-app-title" content="在庫RM">
<style>
  :root{
    --bg:#faf8f3; --panel:#ffffff; --panel2:#f3f0e9; --line:#e2ddd2;
    --ink:#2b2b2b; --mut:#8a8475; --acc:#1f7a8c;
    --urgent:#d6455d; --watch2:#e08a1e; --watch:#c79a1e; --calm:#2a9d6f;
    --ab:#d6455d; --bk:#1f7a8c;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:20px;max-width:1200px;margin:0 auto}
  h1{font-size:20px;font-weight:800;letter-spacing:.04em;margin-bottom:2px}
  h1 .ab{color:var(--ab)} h1 .bk{color:var(--bk)}
  .sub{color:var(--mut);font-size:12px;margin-bottom:14px;font-family:var(--mono)}
  .sub .warn{color:var(--urgent);font-weight:700}
  .nav{display:flex;gap:8px;margin-bottom:16px}
  .nav a{font-size:12px;color:var(--acc);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;min-width:120px}
  .kpi .n{font-size:26px;font-weight:800;font-family:var(--mono)}
  .kpi .l{font-size:11px;color:var(--mut);letter-spacing:.05em}
  .kpi.urgent .n{color:var(--urgent)} .kpi.watch .n{color:var(--watch)}
  .kpi.mon .n{color:var(--acc)} .kpi.calm .n{color:var(--calm)}
  h2{font-size:13px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--mut);font-size:11px;letter-spacing:.05em}
  td.num{font-family:var(--mono);text-align:right}
  .occ-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:50px}
  .occ-bar i{display:block;height:100%;background:var(--calm)}

  /* 月次トップ（稼働率積み上げ棒＋販売率） */
  .months{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .mcard h3{font-size:13px;margin-bottom:10px;color:var(--ink);font-weight:800}
  .prow{display:grid;grid-template-columns:96px 1fr 86px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
  .prow .pn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack{height:16px;background:var(--panel2);border-radius:4px;overflow:hidden;display:flex}
  .stack .s-ab{height:100%;background:var(--ab)}
  .stack .s-bk{height:100%;background:var(--bk)}
  .occnum{font-size:11px;color:var(--mut);font-family:var(--mono)}
  .sell{text-align:right;font-family:var(--mono)}
  .sell .v{font-size:16px;font-weight:800}
  .sell .l{font-size:9px;color:var(--mut)}
  .mlegend{font-size:10px;color:var(--mut);margin-top:8px}
  .mlegend i{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin:0 3px 0 8px}

  /* ガント（1行・予約済みは薄テキスト） */
  .gantt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .gantt-grid{display:grid;gap:2px;min-width:600px}
  .gantt-row{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
  .gantt-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gantt-cells{display:grid;gap:1px}
  .gcell{height:22px;border-radius:2px;background:var(--panel2);position:relative;overflow:visible}
  .gcell.booked{background:#d8d2c4}
  /* 予約済みの塊を枠で囲う（始点=左線/終点=右線、上下線で帯に） */
  .gcell.booked{border-top:1px solid #bdb3a0;border-bottom:1px solid #bdb3a0}
  .gcell.run-start{border-left:2px solid #9b9079;border-top-left-radius:3px;border-bottom-left-radius:3px}
  .gcell.run-end{border-right:2px solid #9b9079;border-top-right-radius:3px;border-bottom-right-radius:3px}
  /* 同日IN/OUT: セルを斜線で分割（左下=チェックアウト側 / 右上=チェックイン側） */
  .gcell.turn{background:linear-gradient(to top right,#cdc6b6 0 47%,#8a8475 47% 53%,#e6e1d4 53% 100%)}
  .gcell.none{background:transparent;border:1px dashed var(--line)}
  .gcell.vacant{cursor:pointer}
  .gcell.vacant.最重要{background:var(--urgent)}
  .gcell.vacant.監視{background:var(--acc)}
  .gcell.vacant.ウォッチ{background:var(--watch)}
  .gcell.vacant.余裕{background:var(--calm)}
  .gcell.vacant.none-pri{background:#b8e0d0}
  .gcell.chk{outline:2px solid var(--watch2);outline-offset:-2px}
  .run-label{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--mut);font-family:var(--mono);white-space:nowrap;pointer-events:none;z-index:1}
  .gantt-head{display:grid;font-size:9px;color:var(--mut);font-family:var(--mono);margin-bottom:3px}
  .gantt-month{font-size:10px;color:var(--mut);font-weight:700;padding-left:2px}
  .gantt-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--mut)}
  .gantt-legend span{display:inline-flex;align-items:center;gap:4px}
  .gantt-legend i{width:12px;height:12px;border-radius:2px;display:inline-block}

  /* チケット */
  .ticket{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ticket.最重要{border-left-color:var(--urgent)}
  .ticket.監視{border-left-color:var(--acc)}
  .ticket.ウォッチ{border-left-color:var(--watch)}
  .ticket.余裕{border-left-color:var(--calm)}
  .datebar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .datebar .dates{font-size:28px;font-weight:800;font-family:var(--mono);letter-spacing:.01em;line-height:1.1}
  .datebar .nights{font-size:15px;font-weight:700;color:var(--mut);background:var(--panel2);padding:2px 10px;border-radius:6px}
  .datebar .until{font-size:13px;font-weight:700;color:var(--mut);margin-left:auto}
  .datebar .until.soon{color:var(--urgent)}
  .thead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.05em}
  .badge.最重要{background:rgba(214,69,93,.15);color:var(--urgent)}
  .badge.監視{background:rgba(31,122,140,.15);color:var(--acc)}
  .badge.ウォッチ{background:rgba(199,154,30,.18);color:var(--watch)}
  .badge.余裕{background:rgba(42,157,111,.15);color:var(--calm)}
  .tname{font-weight:700;font-size:15px}
  .chan{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px}
  .chan.ab{background:rgba(214,69,93,.12);color:var(--ab)}
  .chan.bk{background:rgba(31,122,140,.12);color:var(--bk)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
  .cell{background:var(--panel2);border-radius:7px;padding:7px 9px}
  .cell .l{font-size:10px;color:var(--mut);letter-spacing:.04em}
  .cell .v{font-size:15px;font-weight:700;font-family:var(--mono)}
  .react{margin-top:10px;font-size:12px;padding:6px 10px;border-radius:6px;background:var(--panel2);color:var(--acc)}
  .expand-btn{margin-top:10px;font-size:12px;color:var(--acc);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;width:100%}
  .summary-panel{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .summary-panel.open{display:block}
  .sp-title{font-size:11px;color:var(--mut);letter-spacing:.08em;margin:10px 0 4px;font-weight:700}
  .sp-title.ab{color:var(--ab)} .sp-title.bk{color:var(--bk)}
  .sp-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
  .sp-row .v{font-family:var(--mono);font-weight:700;white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
  .tag.good{background:rgba(42,157,111,.15);color:var(--calm)}
  .tag.bad{background:rgba(214,69,93,.15);color:var(--urgent)}
  .ticket.flash{animation:flash 1.2s ease}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 1px 3px rgba(0,0,0,.05)}}
  .empty{color:var(--mut);padding:20px;text-align:center;font-family:var(--mono)}
  .foot{margin-top:24px;color:var(--mut);font-size:11px;font-family:var(--mono);border-top:1px solid var(--line);padding-top:10px}

  @media (max-width:600px){
    body{padding:12px;font-size:15px}
    h1{font-size:18px}
    .kpi{min-width:calc(50% - 6px);padding:10px 12px}
    .kpi .n{font-size:22px}
    .datebar .dates{font-size:24px}
    .grid{grid-template-columns:repeat(2,1fr);gap:6px}
    table{font-size:12px}
    th,td{padding:7px 6px}
  }
</style>
</head>

function init(){
  if(!D){ document.getElementById('meta').innerHTML='<span class="warn">データ未埋め込み。build_integrated.js を実行してください。</span>'; return; }

  document.getElementById('kpis').innerHTML = `
    <div class="kpi urgent"><div class="n">${c.最重要||0}</div><div class="l">最重要</div></div>

function renderMonths(){
  const props = D.properties.filter(p=>p.bookingListed); // 富津除く（Booking掲載5物件）
  const nMonths = (props[0] && props[0].monthly ? props[0].monthly.length : 2);

  for(let mi=0; mi<nMonths; mi++){
    const label = props[0].monthly[mi].label;
    let rows='';

      const m=p.monthly[mi];

        <span class="pn" title="${esc(p.short)}">${esc(p.short).slice(0,8)}</span>
        <div>
          <div class="stack"><div class="s-ab" style="width:${ab}%"></div><div class="s-bk" style="width:${bk}%"></div></div>
          <span class="occnum">稼働 ${m.occupancy??'—'}%（AB${ab} / BK${bk}）</span>
        </div>
        <div class="sell"><div class="v">${m.sellThrough??'—'}%</div><div class="l">販売率 ${m.sellSold}/${m.sellDenom}</div></div>
      </div>`;
    }
    html += `<div class="mcard"><h3>${label}</h3>${rows}
      <div class="mlegend">稼働率＝月日数が分母<i style="background:var(--ab)"></i>Airbnb<i style="background:var(--bk)"></i>Booking ／ 販売率＝間1日空きを母数から除外</div></div>`;
  }
  document.getElementById('months').innerHTML = html;
}

function renderGantt(){
  const el=document.getElementById('gantt');
  const dates=D.axis.dates, n=D.axis.days, colW=`repeat(${n}, 1fr)`;
  let monthLabels='';
  dates.forEach(ds=>{ const mo=+ds.slice(5,7),dd=+ds.slice(8,10);
    let l=''; if(dd===1)l=mo+'月'; else if(dd===8||dd===15||dd===22)l=dd; monthLabels+=`<div class="gantt-month">${l}</div>`; });
  const rowsHtml = D.gantt.map(row=>{
    const cells=row.cells.map(c=>{
      const ab=c.ab, bk=c.bk;
      let cls='gcell', pri='';
      if(ab && ab.vacant){ cls+=' vacant'; pri=ab.priority||'none-pri'; cls+=' '+pri; }
      else if(ab && !ab.vacant){ cls+=' booked';
        if(ab.runStart) cls+=' run-start';
        if(ab.runEnd) cls+=' run-end';
        if(ab.turnover) cls+=' turn';
      }
      else cls+=' none';
      if(c.needsCheck) cls+=' chk';
      const tid = (ab&&ab.ticketId)?`data-tid="${ab.ticketId}"`:'';
      const runLabel = (ab && ab.runLabel)?`<span class="run-label">${ab.runLabel}</span>`:'';
      const turnTxt = (ab&&ab.turnover)?` / 同日IN/OUT(${ab.turnover.out}→${ab.turnover.in})`:'';
      const title=[`${esc(row.short)} ${c.date}`,
        ab?(ab.vacant?`AB:空 ${yen(ab.price)}`:`予約: ${ab.channel||''}${turnTxt}`):'AB:-',
        bk?`BK:${bk.sale} ${yen(bk.price)}${bk.priceNet!=null?`(手取${yen(bk.priceNet)})`:''}`:'BK:-',
        c.priceDiffPct!=null?`差${c.priceDiffPct}%(手取比)`:'', c.needsCheck||''].filter(Boolean).join(' / ');
      return `<div class="${cls}" ${tid} title="${title}">${runLabel}</div>`;
    }).join('');
    return `<div class="gantt-row"><div class="gantt-name" title="${esc(row.name)}">${esc(row.short).slice(0,12)}</div>
      <div class="gantt-cells" style="grid-template-columns:${colW}">${cells}</div></div>`;
  }).join('');
  el.innerHTML=`<div class="gantt"><div class="gantt-grid">
    <div class="gantt-row"><div class="gantt-name" style="color:var(--mut);font-size:10px">${D.axis.startDate} 〜</div>
      <div class="gantt-head" style="grid-template-columns:${colW}">${monthLabels}</div></div>
    ${rowsHtml}</div>
    <div class="gantt-legend">
      <span><i style="background:var(--urgent)"></i>最重要</span>
      <span><i style="background:var(--acc)"></i>監視</span>
      <span><i style="background:var(--watch)"></i>ウォッチ</span>
      <span><i style="background:var(--calm)"></i>余裕</span>
      <span><i style="background:#d8d2c4"></i>予約済(AB/BK泊数を薄字表示)</span>
      <span><i style="background:linear-gradient(to top right,#cdc6b6 47%,#8a8475 47% 53%,#e6e1d4 53%)"></i>同日IN/OUT</span>
      <span><i style="outline:2px solid var(--watch2)"></i>要確認</span>
    </div></div>`;
  el.querySelectorAll('.gcell.vacant[data-tid]').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const card=document.getElementById(cell.getAttribute('data-tid'));
      if(card){ card.scrollIntoView({behavior:'smooth',block:'center'}); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
    });
  });
}

function summaryPanelHtml(p){
  if(!p) return '<div class="empty">物件情報なし</div>';
  const ab=p.airbnb||{}, bk=p.booking, f=ab.funnel;
  const conv=(v,a)=> v==null?'—':`<span class="v">${v}%</span> <small style="color:var(--mut)">(エリア${a}%)</small> ${v<a?'<span class="tag bad">低</span>':'<span class="tag good">良</span>'}`;
  let h=`<div class="sp-title ab">AIRBNB</div>
    <div class="sp-row"><span>販売稼働率(30日・ブロック除外)</span><span class="v">${ab.occupancy??'—'}%</span></div>`;
  if(f) h+=`<div class="sp-row"><span>ファネル(${esc(f.period)})</span><span class="v">露${f.impr}→ク${f.click}(${f.ctr})→予${f.bookings}</span></div>
    <div class="sp-row"><span>ボトルネック</span><span style="color:var(--watch2);font-size:12px;text-align:right">${esc(f.bottleneck)}</span></div>`;
  if(bk){
    h+=`<div class="sp-title bk">BOOKING</div>
    <div class="sp-row"><span>検索→PV転換</span><span>${conv(bk.searchToPv,bk.areaSearchToPv)}</span></div>
    <div class="sp-row"><span>PV→予約転換</span><span>${conv(bk.pvToBook,bk.areaPvToBook)}</span></div>
    <div class="sp-row"><span>ADR / 7日予約</span><span class="v">${yen(bk.adr)} / ${bk.bookings7d??'—'}</span></div>
    <div class="sp-row"><span>キャンセル率</span><span><span class="v">${bk.cancel}%</span> <small style="color:var(--mut)">(${bk.areaCancel}%)</small> ${(bk.cancelColor||'').includes('red')?'<span class="tag bad">赤</span>':'<span class="tag good">緑</span>'}</span></div>
    <div class="sp-row"><span>ページScore / クチコミ</span><span class="v">${bk.pageScore??'—'} / ${bk.reviewScore??'—'}</span></div>
    <div class="sp-row"><span>街順位パーセンタイル</span><span class="v">${bk.rankPct??'—'}</span></div>
    <div class="sp-row"><span>先々予約(Pace)</span><span class="v">${bk.paceRoomNights??'—'}泊 <small style="color:var(--mut)">前年比${bk.paceYoY!=null?Math.round(bk.paceYoY)+'%':'—'}</small></span></div>`;
  } else h+=`<div class="sp-title bk">BOOKING</div><div class="sp-row"><span>掲載</span><span>未掲載</span></div>`;
  return h;
}

function renderTickets(){
  const order={'最重要':0,'監視':1,'ウォッチ':2,'余裕':3};
  const tk=[...D.tickets].sort((a,b)=>(order[a.priority]??9)-(order[b.priority]??9));
  if(!tk.length){ document.getElementById('tickets').innerHTML='<div class="empty">チケットなし</div>'; return; }
  document.getElementById('tickets').innerHTML = tk.map((t,i)=>{
    const id=t.ticketId||('tk'+i);
    const chg = t.p3ChangePct;
    const chgHtml = chg==null ? '<span style="color:var(--mut)">—</span>'
      : `<span style="color:${chg>=0?'var(--calm)':'var(--urgent)'}">${chg>=0?'▲':'▼'}${Math.abs(chg)}%</span>`;
    const bkPriceCell = t.bkId
      ? (t.bkPriceNet!=null
          ? `${yen(t.bkPriceNet)}<small style="color:var(--mut);font-size:11px"> 手取(提示${yen(t.bkPrice)})</small>`
          : (t.bkPrice!=null?`${yen(t.bkPrice)}<small style="color:var(--mut);font-size:11px"> 提示</small>`:'<span style="font-size:12px;color:var(--mut)">データなし</span>'))
      : '<span style="font-size:12px;color:var(--mut)">未掲載</span>';
    const resHtml = (r)=>{
      if(!r) return '<span style="color:var(--mut)">—</span>';
      const ch = `<span class="chan ${r.channel==='BK'?'bk':'ab'}">${r.channel}</span>`;
      const price = r.priceTotal!=null ? yen(r.priceTotal) : '—';
      const sub = (r.channel==='BK' && r.gross!=null) ? `<small style="color:var(--mut);font-size:11px"> 手取(提示${yen(r.gross)})</small>` : '';
      const pn = r.pricePerNight!=null ? `<small style="color:var(--mut);font-size:11px"> /泊${yen(r.pricePerNight)}</small>` : '';
      const g  = (r.guests!=null) ? `<small style="color:var(--mut);font-size:11px"> ${r.guests}名</small>` : '';
      return `${ch} ${price}${sub}${pn}${g}`;
    };
    return `<div class="ticket ${t.priority}" id="${id}">
      <div class="datebar">
        <span class="dates">${fmtMD(t.start)} 〜 ${fmtMD(t.checkout||t.end)}</span>
        <span class="nights">${t.nights}泊</span>
        <span class="until ${t.until<=7?'soon':''}">${t.until<=0?'本日から':'あと'+t.until+'日'}</span>
      </div>
      <div class="thead"><span class="badge ${t.priority}">${t.priority}</span><span class="tname">${esc(t.name).slice(0,24)}</span></div>
      <div class="grid">
        <div class="cell"><div class="l"><span class="chan ab">AB</span> 現在価格</div><div class="v">${yen(t.abPrice)}</div></div>
        <div class="cell"><div class="l"><span class="chan bk">BK</span> 現在価格</div><div class="v">${bkPriceCell}</div></div>
        <div class="cell"><div class="l"><span class="chan ab">AB</span> 検索露出(p2)</div><div class="v" style="color:${t.viewOK?'var(--calm)':'var(--urgent)'}">${t.exposureP2??'—'}</div></div>
        <div class="cell"><div class="l"><span class="chan ab">AB</span> ページ閲覧(p3) / 前回観測比</div><div class="v" style="font-size:13px">${t.viewsP3??'—'} ${chgHtml}</div></div>
        <div class="cell"><div class="l"><span class="chan bk">BK</span> 目安閲覧 <span style="opacity:.6">7日検索</span></div><div class="v" style="font-size:13px">${t.bkGuideViews??'—'}</div></div>
      </div>
      <div class="grid">
        <div class="cell"><div class="l">前の予約 <span style="opacity:.6">最近接</span></div><div class="v" style="font-size:13px">${resHtml(t.prevRes)}</div></div>
        <div class="cell"><div class="l">次の予約 <span style="opacity:.6">最近接</span></div><div class="v" style="font-size:13px">${resHtml(t.nextRes)}</div></div>
      </div>
      <div class="react">反応: ${esc(t.reaction)}</div>
      <button class="expand-btn" onclick="toggleSummary('${id}','${t.id}')">▼ 物件サマリーを表示</button>
      <div class="summary-panel" id="sp_${id}"></div>
    </div>`;
  }).join('');
}

function toggleSummary(tid, abId){
  const panel=document.getElementById('sp_'+tid);
  const btn=panel.previousElementSibling;
  if(panel.classList.contains('open')){ panel.classList.remove('open'); btn.textContent='▼ 物件サマリーを表示'; return; }
  if(!panel.dataset.loaded){ panel.innerHTML=summaryPanelHtml(propByAb(abId)); panel.dataset.loaded='1'; }
  panel.classList.add('open'); btn.textContent='▲ 閉じる';
}

init();
</script>
</body>
</html>
