<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空室在庫ダッシュボード</title>
<style>
  :root{
    --bg:#faf8f3; --panel:#ffffff; --panel2:#f3f0e9; --line:#e2ddd2;
    --ink:#2b2b2b; --mut:#8a8475; --acc:#1f7a8c;
    --urgent:#d6455d; --watch2:#e08a1e; --watch:#c79a1e; --calm:#2a9d6f;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:20px;max-width:1200px;margin:0 auto}
  h1{font-size:20px;font-weight:800;letter-spacing:.04em;margin-bottom:2px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:18px;font-family:var(--mono)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;min-width:120px}
  .kpi .n{font-size:26px;font-weight:800;font-family:var(--mono)}
  .kpi .l{font-size:11px;color:var(--mut);letter-spacing:.05em}
  .kpi.urgent .n{color:var(--urgent)} .kpi.watch .n{color:var(--watch)}
  .kpi.mon .n{color:var(--acc)} .kpi.calm .n{color:var(--calm)}
  h2{font-size:13px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--mut);font-size:11px;letter-spacing:.05em}
  td.num{font-family:var(--mono);text-align:right}
  .occ-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
  .occ-bar i{display:block;height:100%;background:var(--calm)}
  .ticket{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ticket.最重要{border-left-color:var(--urgent)}
  .ticket.監視{border-left-color:var(--acc)}
  .ticket.ウォッチ{border-left-color:var(--watch)}
  .ticket.余裕{border-left-color:var(--calm)}
  .thead{display:flex;justify-content:flex-start;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .datebar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .datebar .dates{font-size:28px;font-weight:800;font-family:var(--mono);letter-spacing:.01em;line-height:1.1}
  .datebar .nights{font-size:15px;font-weight:700;color:var(--mut);background:var(--panel2);padding:2px 10px;border-radius:6px}
  .datebar .until{font-size:13px;font-weight:700;color:var(--mut);margin-left:auto}
  .datebar .until.soon{color:var(--urgent)}
  .tname{font-weight:700;font-size:15px}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.05em}
  .badge.最重要{background:rgba(255,77,94,.15);color:var(--urgent)}
  .badge.監視{background:rgba(76,201,240,.15);color:var(--acc)}
  .badge.ウォッチ{background:rgba(255,216,77,.15);color:var(--watch)}
  .badge.余裕{background:rgba(61,220,151,.15);color:var(--calm)}
  .tmeta{color:var(--mut);font-size:12px;font-family:var(--mono)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
  .cell{background:var(--panel2);border-radius:7px;padding:7px 9px}
  .cell .l{font-size:10px;color:var(--mut);letter-spacing:.04em}
  .cell .v{font-size:15px;font-weight:700;font-family:var(--mono)}
  .react{margin-top:10px;font-size:12px;padding:6px 10px;border-radius:6px;background:var(--panel2);color:var(--acc)}
  .spark{display:flex;align-items:flex-end;gap:2px;height:24px;margin-top:4px}
  .spark i{flex:1;background:var(--acc);opacity:.6;min-height:2px;border-radius:1px}
  .empty{color:var(--mut);padding:20px;text-align:center;font-family:var(--mono)}

  /* ガントチャート（空室マップ） */
  .gantt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .gantt-grid{display:grid;gap:2px;min-width:600px}
  .gantt-head{display:grid;gap:0;font-size:9px;color:var(--mut);font-family:var(--mono);margin-bottom:3px}
  .gantt-row{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
  .gantt-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gantt-cells{display:grid;gap:1px}
  .gcell{height:22px;border-radius:2px;cursor:default;background:var(--panel2)}
  .gcell.booked{background:#d8d2c4}
  .gcell.none{background:transparent;border:1px dashed var(--line)}
  .gcell.vacant{cursor:pointer}
  .gcell.vacant.最重要{background:var(--urgent)}
  .gcell.vacant.監視{background:var(--acc)}
  .gcell.vacant.ウォッチ{background:var(--watch)}
  .gcell.vacant.余裕{background:var(--calm)}
  .gcell.vacant.none-pri{background:#b8e0d0}
  .gantt-month{font-size:10px;color:var(--mut);font-weight:700;padding-left:2px}
  .gantt-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--mut)}
  .gantt-legend span{display:inline-flex;align-items:center;gap:4px}
  .gantt-legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
  .ticket.flash{animation:flash 1.2s ease}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 1px 3px rgba(0,0,0,.05)}}
  .foot{margin-top:24px;color:var(--mut);font-size:11px;font-family:var(--mono);border-top:1px solid var(--line);padding-top:10px}
  .upload{margin-bottom:16px;padding:10px;border:1px dashed var(--line);border-radius:8px;color:var(--mut);font-size:12px}

  /* スマホ最適化 */
  @media (max-width:600px){
    body{padding:12px;font-size:15px}
    h1{font-size:18px}
    .row{gap:6px}
    .kpi{min-width:calc(50% - 6px);padding:10px 12px}
    .kpi .n{font-size:22px}
    .datebar .dates{font-size:24px}
    .grid{grid-template-columns:repeat(2,1fr);gap:6px}
    .cell{padding:8px 10px}
    .cell .v{font-size:16px}
    .tname{font-size:13px}
    table{font-size:12px}
    th,td{padding:7px 6px}
  }
</style>

<body>
  <h1>空室在庫ダッシュボード</h1>
  <div class="sub" id="meta">データ読込中…</div>

  <div class="upload" id="uploadBox">
    dashboard_data.json を読み込み:
    <input type="file" id="file" accept="application/json">
    <span style="opacity:.7">（同じフォルダに置けば自動読込。手動なら選択）</span>
  </div>

  <div class="row" id="kpis"></div>

  <h2>物件別 稼働率（他OTA含む）</h2>
  <div id="summary"></div>

  <h2>空室マップ（60日・物件横断）</h2>
  <div id="gantt"><div class="empty">読込待ち</div></div>

  <h2>空室在庫チケット（優先度順）</h2>
  <div id="tickets"><div class="empty">読込待ち</div></div>

  <div class="foot" id="foot"></div>

<script>
const yen = n => n==null?'—':'¥'+Number(n).toLocaleString();
const fmtMD = s => { const m=String(s).match(/\d{4}-(\d{2})-(\d{2})/); return m?`${+m[1]}/${+m[2]}`:s; };
const esc = s => String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function render(d){
  document.getElementById('meta').textContent =
    `取得日 ${d.fetchDate} ／ 生成 ${new Date(d.generatedAt).toLocaleString('ja-JP')} ／ 閲覧基準 ${d.minPerdayDefault}/日`;

  const c = d.counts||{};
  document.getElementById('kpis').innerHTML = `
    <div class="kpi urgent"><div class="n">${c.最重要||0}</div><div class="l">最重要（賞味期限間近×売れ残り）</div></div>
    <div class="kpi mon"><div class="n">${c.監視||0}</div><div class="l">監視（間近だが閲覧順調）</div></div>
    <div class="kpi watch"><div class="n">${c.ウォッチ||0}</div><div class="l">ウォッチ</div></div>
    <div class="kpi calm"><div class="n">${c.余裕||0}</div><div class="l">余裕</div></div>`;

  // 稼働率テーブル
  let s = '<table><tr><th>物件</th><th>稼働率</th><th></th><th class="num">予約/総日</th></tr>';
  for(const x of (d.summary||[])){
    s += `<tr><td>${esc(x.name).slice(0,18)}</td>
      <td class="num">${x.occupancy??'—'}%</td>
      <td><div class="occ-bar"><i style="width:${x.occupancy||0}%"></i></div></td>
      <td class="num">${x.bookedDays}/${x.totalDays}</td></tr>`;
  }
  s += '</table>';
  document.getElementById('summary').innerHTML = s;

  // ガントチャート（空室マップ）
  renderGantt(d.gantt);

  // チケット
  const tk = d.tickets||[];
  if(!tk.length){ document.getElementById('tickets').innerHTML='<div class="empty">チケットなし</div>'; }
  else{
    document.getElementById('tickets').innerHTML = tk.map(t=>{
      const ph = (t.priceHistory||[]).filter(x=>x.p);
      const max = Math.max(...ph.map(x=>x.p),1);
      const spark = ph.length>1 ? `<div class="spark">${ph.map(x=>`<i style="height:${Math.round(x.p/max*100)}%"></i>`).join('')}</div>` : '<span class="tmeta">推移は履歴蓄積中</span>';
      return `<div class="ticket ${t.priority}" id="${t.ticketId||''}">
        <div class="datebar">
          <span class="dates">${fmtMD(t.start)} 〜 ${fmtMD(t.checkout||t.end)}</span>
          <span class="nights">${t.nights}泊</span>
          <span class="until ${t.until<=7?'soon':''}">${t.until<=0?'本日から':'あと'+t.until+'日'}</span>
        </div>
        <div class="thead">
          <span class="badge ${t.priority}">${t.priority}</span>
          <span class="tname">${esc(t.name).slice(0,24)}</span>
        </div>
        <div class="grid">
          <div class="cell"><div class="l">現在販売価格</div><div class="v">${yen(t.currentPrice)}</div></div>
          <div class="cell"><div class="l">前予約 実価格<span style="opacity:.6">${t.prevReservationDates?' '+t.prevReservationDates:''}</span></div><div class="v">${yen(t.prevReservationPrice)}</div></div>
          <div class="cell"><div class="l">次予約 実価格<span style="opacity:.6">${t.nextReservationDates?' '+t.nextReservationDates:''}</span></div><div class="v">${yen(t.nextReservationPrice)}</div></div>
          <div class="cell"><div class="l">総閲覧 / 期間</div><div class="v">${t.totalP3??'—'}</div></div>
          <div class="cell"><div class="l">30日内 閲覧</div><div class="v">${t.views30??'—'}</div></div>
          <div class="cell"><div class="l">7日内 閲覧</div><div class="v">${t.views7??'—'}</div></div>
          <div class="cell"><div class="l">1日あたり閲覧</div><div class="v" style="color:${t.viewOK?'var(--calm)':'var(--urgent)'}">${t.perday??'—'}</div></div>
          <div class="cell"><div class="l">価格推移</div>${spark}</div>
        </div>
        <div class="react">反応: ${esc(t.reaction)}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('foot').textContent =
    `チケット総数 ${tk.length}件 ／ このページは閲覧専用（編集不可）`;
}

function renderGantt(g){
  const el = document.getElementById('gantt');
  if(!g || !g.rows || !g.rows.length){ el.innerHTML='<div class="empty">空室マップのデータがありません</div>'; return; }
  const n = g.days;
  const colW = `repeat(${n}, 1fr)`;

  // 日付ラベル: 各月の1日は「N月」、8・15・22日はその数字、他は空白
  let monthLabels = '';
  g.dates.forEach((ds)=>{
    const mo = +ds.slice(5,7);
    const dd = +ds.slice(8,10);
    let label = '';
    if (dd === 1) label = mo + '月';
    else if (dd === 8 || dd === 15 || dd === 22) label = dd;
    monthLabels += `<div class="gantt-month">${label}</div>`;
  });

  const rowsHtml = g.rows.map(row=>{
    const cells = row.cells.map((c,i)=>{
      const date = g.dates[i];
      if(c.s==='vacant'){
        const pri = c.priority || 'none-pri';
        const tid = c.ticketId ? `data-tid="${c.ticketId}"` : '';
        return `<div class="gcell vacant ${pri}" ${tid} title="${row.name} ${date} 空室"></div>`;
      }
      if(c.s==='booked') return `<div class="gcell booked" title="${date} 予約済"></div>`;
      return `<div class="gcell none" title="${date} データなし"></div>`;
    }).join('');
    return `<div class="gantt-row">
      <div class="gantt-name" title="${esc(row.name)}">${esc(row.name).slice(0,12)}</div>
      <div class="gantt-cells" style="grid-template-columns:${colW}">${cells}</div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="gantt">
    <div class="gantt-grid">
      <div class="gantt-row">
        <div class="gantt-name" style="color:var(--mut);font-size:10px">${g.startDate} 〜</div>
        <div class="gantt-head" style="grid-template-columns:${colW}">${monthLabels}</div>
      </div>
      ${rowsHtml}
    </div>
    <div class="gantt-legend">
      <span><i style="background:var(--urgent)"></i>最重要</span>
      <span><i style="background:var(--acc)"></i>監視</span>
      <span><i style="background:var(--watch)"></i>ウォッチ</span>
      <span><i style="background:var(--calm)"></i>余裕</span>
      <span><i style="background:#d8d2c4"></i>予約済</span>
    </div>
  </div>`;

  // 空室帯タップ→該当チケットへスクロール＆ハイライト
  el.querySelectorAll('.gcell.vacant[data-tid]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const tid = cell.getAttribute('data-tid');
      const card = document.getElementById(tid);
      if(card){
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
      }
    });
  });
}

// データ読込の優先順位:
// 1) 埋め込みデータ（build_dashboard.jsが生成した dashboard_view.html）
// 2) 同階層の dashboard_data.json を fetch（サーバー経由で開いた場合）
// 3) 手動ファイル選択
if (window.__DASHBOARD_DATA__) {
  render(window.__DASHBOARD_DATA__);
  document.getElementById('uploadBox').style.display='none';
} else {
  fetch('dashboard_data.json').then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(d=>{ render(d); document.getElementById('uploadBox').style.display='none'; })
    .catch(()=>{ document.getElementById('meta').textContent='dashboard_data.json を選択してください'; });
}

document.getElementById('file').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ render(JSON.parse(rd.result)); document.getElementById('uploadBox').style.display='none'; }catch(err){ alert('JSON読込エラー: '+err); } };
  rd.readAsText(f);
});
</script>
</body>
</html>
