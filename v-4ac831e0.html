const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));const yen=n=>n==null?'—':'¥'+Number(n).toLocaleString();const signed=n=>n==null?'—':(n>0?'+':'')+n;
document.getElementById('meta').textContent=`取得日 ${D.fetchDate} ／ 生成 ${new Date(D.generatedAt).toLocaleString('ja-JP')}`;
document.getElementById('notice').textContent=D.metricNotice+(D.runStatus?.overall&&D.runStatus.overall!=='ok'?` ／ 実行状態: ${D.runStatus.overall}`:'');
const c=D.counts||{};document.getElementById('cards').innerHTML=`<div class="card urgent"><b>${c.最重要||0}</b>最重要</div><div class="card monitor"><b>${c.監視||0}</b>監視</div><div class="card watch"><b>${c.ウォッチ||0}</b>ウォッチ</div><div class="card calm"><b>${c.余裕||0}</b>余裕</div>`;
document.getElementById('summary').innerHTML='<tr><th>物件</th><th class="num">予約泊</th><th class="num">空室泊</th><th class="num">ブロック</th><th class="num">販売稼働率</th></tr>'+D.summary.map(x=>`<tr><td>${esc(x.name).slice(0,28)}</td><td class="num">${x.bookedDays}</td><td class="num">${x.availableDays}</td><td class="num">${x.blockedDays}</td><td class="num">${x.occupancy??'—'}%</td></tr>`).join('');
document.getElementById('tickets').innerHTML=D.tickets.map(t=>`<div class="ticket ${t.priority}"><div class="head"><span class="badge">${t.priority}</span><span class="name">${esc(t.name)}</span></div><div class="period">${t.start}〜${t.end}（${t.nights}泊）／${t.period}</div><div class="grid"><div class="metric"><small>現在販売価格</small><b>${yen(t.currentPrice)}</b></div><div class="metric"><small>検索露出 p2</small><b>${t.exposureP2??'—'}</b><small>前回差 ${signed(t.p2Change)}</small></div><div class="metric"><small>ページ閲覧 p3</small><b>${t.viewsP3??'—'}</b><small>前回差 ${signed(t.p3Change)}</small></div><div class="metric"><small>CTR</small><b>${t.ctrPct??'—'}${t.ctrPct==null?'':'%'}</b><small>${t.metricQuality}</small></div></div><div class="react"><b>${t.signal}</b>：${esc(t.reaction)}</div></div>`).join('');
document.getElementById('gantt').innerHTML=D.gantt.rows.map(r=>`<div class="grow"><div class="gname">${esc(r.name)}</div>${r.cells.map(c=>`<div class="day ${c.s}" title="${c.s}"></div>`).join('')}</div>`).join('');
