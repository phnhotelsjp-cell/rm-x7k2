<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統合ダッシュボード Airbnb × Booking</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --txt:#e6e8ec; --mut:#9aa3b2;
    --book:#5b6bff; --vac:#22324a; --ab:#ff5a5f; --bk:#003580; --warn:#e0a23a; --good:#3fb950; --bad:#f0573f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0}
  .meta{color:var(--mut);font-size:12px}
  .warn{color:var(--warn)}
  nav{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
  nav button.active{background:var(--book);border-color:var(--book)}
  main{padding:16px;overflow:auto}
  .view{display:none}.view.active{display:block}
  table{border-collapse:collapse;font-size:12px}
  .gantt td,.gantt th{border:1px solid var(--line);padding:0;text-align:center;min-width:34px;height:34px;font-size:10px}
  .gantt th.name{min-width:150px;text-align:left;padding:4px 6px;position:sticky;left:0;background:var(--panel);z-index:2}
  .gantt td.name{min-width:150px;text-align:left;padding:4px 6px;position:sticky;left:0;background:var(--panel);z-index:1}
  .cell{display:flex;flex-direction:column;height:100%}
  .cell .ab,.cell .bk{flex:1;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1}
  .cell .ab{border-bottom:1px solid var(--line)}
  .ab-book{background:#3a2326}.ab-vac{background:#1d2b1d}
  .bk-booked{background:#1b2a4a}.bk-open{background:#13351f}.bk-offsale{background:#2a2f3a;color:var(--mut)}
  .pdiff{font-size:8px;color:var(--warn)}
  .check{outline:2px solid var(--warn);outline-offset:-2px}
  .wk{color:var(--mut)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0}
  .kv b{font-weight:600}
  .tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px}
  .t-good{background:#16331f;color:var(--good)}.t-bad{background:#3a1d1a;color:var(--bad)}.t-warn{background:#3a2f17;color:var(--warn)}
  .pri-最重要{color:var(--bad);font-weight:700}.pri-監視{color:var(--warn)}.pri-ウォッチ{color:var(--mut)}
  .legend{font-size:11px;color:var(--mut);margin:6px 0}
  .legend span{display:inline-block;margin-right:12px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
  .bar{height:8px;background:var(--book);border-radius:2px}
  .barbg{background:var(--vac);border-radius:2px;flex:1}
  .ticket{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:6px;background:var(--panel)}
  .ticket.最重要{border-left-color:var(--bad)}.ticket.監視{border-left-color:var(--warn)}
  small{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>統合ダッシュボード <span style="color:var(--ab)">Airbnb</span> × <span style="color:var(--book)">Booking</span></h1>
  <div class="meta" id="meta"></div>
</header>
<nav>
  <button data-v="gantt" class="active">未来日ガント</button>
  <button data-v="tickets">空室チケット</button>
  <button data-v="summary">物件サマリー</button>
  <button data-v="area">エリア地合い</button>
</nav>
<main>
  <section class="view active" id="gantt">
    <div class="legend">
      <span><i class="sw" style="background:#3a2326"></i>AB予約済</span>
      <span><i class="sw" style="background:#1d2b1d"></i>AB空き</span>
      <span><i class="sw" style="background:#1b2a4a"></i>BK予約済</span>
      <span><i class="sw" style="background:#13351f"></i>BK販売中</span>
      <span><i class="sw" style="background:#2a2f3a"></i>BK非販売</span>
      <span><i class="sw" style="outline:2px solid var(--warn)"></i>要確認(鮮度差の可能性)</span>
      <span>上段=Airbnb / 下段=Booking、数字は価格</span>
    </div>
    <div style="overflow:auto"><table class="gantt" id="ganttTbl"></table></div>
  </section>
  <section class="view" id="tickets"></section>
  <section class="view" id="summary"></section>
  <section class="view" id="area"></section>
</main>

function init(){
  const w=D.freshnessWarning?`<span class="warn">⚠ 取得時刻差 ${D.staleHours}h（チャネル間のズレは鮮度差の可能性）</span>`:`取得時刻差 ${D.staleHours}h`;
  document.getElementById('meta').innerHTML=`生成:${(D.generatedAt||'').slice(0,16).replace('T',' ')} ／ Airbnb:${D.airbnbFetchedAt} ／ Booking:${(D.bookingFetchedAt||'').slice(0,16).replace('T',' ')} ／ ${w}`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); document.getElementById(b.dataset.v).classList.add('active');
  });
  renderGantt(); renderTickets(); renderSummary(); renderArea();
}

function renderGantt(){
  const t=document.getElementById('ganttTbl');
  const dates=D.axis.dates;
  let h='<tr><th class="name">物件</th>'+dates.map(d=>`<th class="${[0,6].includes(new Date(d+'T00:00').getDay())?'wk':''}">${md(d)}<br>${dow(d)}</th>`).join('')+'</tr>';
  for(const row of D.gantt){
    h+=`<tr><td class="name">${row.short||row.name}${row.bkId?'':' <small>(AB専用)</small>'}</td>`;
    const cmap={}; row.cells.forEach(c=>cmap[c.date]=c);
    for(const d of dates){
      const c=cmap[d]||{};
      const ab=c.ab, bk=c.bk;
      const abCls = ab? (ab.vacant?'ab-vac':'ab-book'):'';
      const abTxt = ab? (ab.vacant? (ab.price?Math.round(ab.price/1000)+'k':'空'):'予') : '';
      const bkCls = bk? ('bk-'+bk.sale):'';
      const bkTxt = bk? (bk.sale==='offsale'?'×':(bk.price?Math.round(bk.price/1000)+'k':(bk.sale==='booked'?'予':'空'))):'';
      const chk=c.needsCheck?'check':'';
      const title=[ab?`AB:${ab.vacant?'空き':'予約('+ (ab.channel||'')+')'} ${yen(ab.price)}`:'AB:-',
                   bk?`BK:${bk.sale} ${yen(bk.price)} 最小${bk.minStay||'-'}泊`:'BK:-',
                   c.priceDiffPct!=null?`価格差${c.priceDiffPct}%`:'', c.needsCheck||''].filter(Boolean).join(' / ');
      h+=`<td class="${chk}" title="${title}"><div class="cell"><div class="ab ${abCls}">${abTxt}</div><div class="bk ${bkCls}">${bkTxt}</div></div></td>`;
    }
    h+='</tr>';
  }
  t.innerHTML=h;
}

function renderTickets(){
  const el=document.getElementById('tickets');
  const order={'最重要':0,'監視':1,'ウォッチ':2,'余裕':3};
  const ts=[...D.tickets].sort((a,b)=>(order[a.priority]??9)-(order[b.priority]??9));
  let h=`<div class="legend">Airbnbの空室チケットに、同じ開始日のBooking状態を併記。perday=Airbnb1日あたり閲覧、viewOK=閲覧十分か。</div>`;
  for(const t of ts){
    const bk=t.bkAtStart;
    const bkLine = t.bkId? (bk?`Booking: <b>${bk.sale}</b> ${yen(bk.price)}`:'Booking: 同日データなし') : 'Booking: 未掲載';
    h+=`<div class="ticket ${t.priority||''}">
      <div><span class="pri-${t.priority}">[${t.priority||'-'}]</span> <b>${t.name}</b></div>
      <div><small>${t.start}〜${t.checkout} (${t.nights}泊) ／ チェックインまで${t.until}日 ／ ${t.period||''}</small></div>
      <div>Airbnb: 現在<b>${yen(t.currentPrice)}</b> (定価${yen(t.listPrice)}) ／ 閲覧/日 ${t.perday??'-'} ${t.viewOK?'<span class="tag t-good">閲覧十分</span>':'<span class="tag t-bad">閲覧弱い</span>'} ／ 反応:${t.reaction||'-'}</div>
      <div>${bkLine}</div>
      ${t.nextReservationPrice?`<div><small>次の予約: ${yen(t.nextReservationPrice)} (${t.nextReservationDates||''})</small></div>`:''}
    </div>`;
  }
  el.innerHTML=h;
}

function renderSummary(){
  const el=document.getElementById('summary');
  let h='<div class="grid">';
  for(const p of D.properties){
    const ab=p.airbnb||{}, bk=p.booking;
    const f=ab.funnel;
    const conv=(v,a)=> v==null?'-':`${v}% <small>(エリア${a}%)</small> ${v<a?'<span class="tag t-bad">低</span>':'<span class="tag t-good">良</span>'}`;
    h+=`<div class="card">
      <div style="font-weight:600;margin-bottom:6px">${p.short} ${p.bookingListed?'':'<small>(Booking未掲載)</small>'}</div>
      <div class="kv"><span>Airbnb稼働(180日)</span><b>${ab.occupancy!=null?ab.occupancy+'%':'-'}</b></div>
      ${f?`<div class="kv"><span>ABファネル(${f.period})</span><b>露${f.impr}→ク${f.click}(${f.ctr})→予${f.bookings}</b></div>
      <div class="kv"><span>ABボトルネック</span><b class="warn">${f.bottleneck}</b></div>`:''}
      ${bk?`
      <div class="kv"><span>BK検索→PV転換</span><span>${conv(bk.searchToPv,bk.areaSearchToPv)}</span></div>
      <div class="kv"><span>BK PV→予約転換</span><span>${conv(bk.pvToBook,bk.areaPvToBook)}</span></div>
      <div class="kv"><span>BK ADR / 7日予約</span><b>${yen(bk.adr)} / ${bk.bookings7d??'-'}</b></div>
      <div class="kv"><span>BKキャンセル率</span><span>${bk.cancel}% <small>(エリア${bk.areaCancel}%)</small> ${bk.cancelColor&&bk.cancelColor.includes('red')?'<span class="tag t-bad">赤</span>':'<span class="tag t-good">緑</span>'}</span></div>
      <div class="kv"><span>BKページScore/クチコミ</span><b>${bk.pageScore??'-'} / ${bk.reviewScore??'-'}</b></div>
      <div class="kv"><span>BK街順位パーセンタイル</span><b>${bk.rankPct??'-'}</b></div>
      <div class="kv"><span>BK先々予約(Pace)</span><b>${bk.paceRoomNights??'-'}泊 <small>前年比${bk.paceYoY!=null?Math.round(bk.paceYoY)+'%':'-'}</small></b></div>
      `:'<div class="kv"><span>Booking</span><span>未掲載</span></div>'}
    </div>`;
  }
  el.innerHTML=h+'</div>';
}

function renderArea(){
  const el=document.getElementById('area');
  const a=D.area;
  if(!a){ el.innerHTML='エリアデータなし'; return; }
  const bars=arr=>arr.map(x=>`<div class="kv"><span>${x.label}</span><div style="display:flex;align-items:center;gap:6px;width:60%"><div class="barbg"><div class="bar" style="width:${Math.min(100,x.percent)}%"></div></div><b style="width:42px;text-align:right">${x.percent}%</b></div></div>`).join('');
  el.innerHTML=`<div class="grid">
    <div class="card"><div style="font-weight:600">市場サマリー（${a.location}）</div>
      <div class="kv"><span>検索数 前年比</span><b class="${a.searchPctChange<0?'warn':''}">${a.searchPctChange}%</b></div>
      <div class="kv"><span>対象期間</span><b>${a.dateFrom}〜${a.dateUntil}</b></div>
      <div class="legend">エリア全体の需要。自物件の数字ではなく「市場の地合い」。</div>
    </div>
    <div class="card"><div style="font-weight:600">予約リードタイム（何日前に予約）</div>${bars(a.bookWindow)}</div>
    <div class="card"><div style="font-weight:600">滞在日数</div>${bars(a.lengthOfStay)}</div>
    <div class="card"><div style="font-weight:600">客層</div>${bars(a.travellerType)}</div>
    <div class="card"><div style="font-weight:600">国籍（上位）</div>${bars(a.topCountries)}</div>
  </div>`;
}
